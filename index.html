<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A tiny task board for practicing Git and GitHub workflows."
    />
    <title>Focus Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">TODAY'S FOCUS</p>
        <h1>Focus Board</h1>
        <p class="subtitle">Keep the next important thing in view.</p>
      </header>

      <section class="card" aria-labelledby="task-heading">
        <div class="section-heading">
          <h2 id="task-heading">My tasks</h2>
          <span id="task-count" aria-live="polite">0 tasks</span>
        </div>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="80"
            placeholder="Add a task..."
            required
          />
          <button type="submit">Add task</button>
        </form>

        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
        <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
